# General System
CONFIG_PRINTK=y
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_THREAD_NAME=y

# DMA / Async UART Setup
# This enables the "Async" API which uses EasyDMA on nRF chips
CONFIG_UART_ASYNC_API=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# Hardware Drivers
CONFIG_GPIO=y
CONFIG_SERIAL=y

#SPI
CONFIG_SPI=y
CONFIG_SPI_SLAVE=y
CONFIG_NRFX_SPIS=y
CONFIG_SPI_ASYNC=y