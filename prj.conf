# Logging over the VCOM UART
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=n

# Modem / DECT PHY
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LINK_BINARY_DECT_PHY=y
CONFIG_MODEM_ANTENNA=n
CONFIG_MCS=4

# The modem event handler runs on the system workqueue; it must be
# preemptible and below the app threads so TX submission is not delayed
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=6
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# SPI slave towards the Teensy, plus the REQ/RDY handshake GPIOs
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SPI_SLAVE=y
CONFIG_SPI_ASYNC=y
CONFIG_POLL=y

CONFIG_TFM_PROFILE_TYPE_MINIMAL=y
CONFIG_HWINFO=y
