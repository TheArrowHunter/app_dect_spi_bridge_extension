# Build the slave image with:
#   west build -b nrf9161dk/nrf9161/ns -- -DEXTRA_CONF_FILE="slave.conf;overlay-eu.conf"
#
# The master is the default and needs no role overlay.

CONFIG_TDMA_ROLE_SLAVE=y

# Larger log buffer so per-packet logging cannot block the modem event handler
CONFIG_LOG_BUFFER_SIZE=16384
